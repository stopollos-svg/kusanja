<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="256" y1="0" x2="256" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="45%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#C2410C" />
    </linearGradient>
    <linearGradient id="coinGrad" x1="200" y1="160" x2="312" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="35%" stop-color="#FACC15" />
      <stop offset="85%" stop-color="#CA8A04" />
      <stop offset="100%" stop-color="#854D0E" />
    </linearGradient>
    <linearGradient id="basketGrad" x1="160" y1="210" x2="352" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="80" y1="100" x2="432" y2="350" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Inner Warm Glow -->
  <circle cx="256" cy="230" r="170" fill="#FDE047" fill-opacity="0.25" />

  <!-- Central Unity Global Ring -->
  <circle cx="256" cy="225" r="140" stroke="url(#ringGrad)" stroke-width="24" fill="none" opacity="0.95" />
  
  <!-- Continents hint inside ring -->
  <path d="M210 140 Q 230 130 250 150 Q 270 140 280 165 Q 260 185 240 180 Z" fill="#F59E0B" opacity="0.3" />
  <path d="M160 200 Q 180 230 200 240 Q 170 260 150 220 Z" fill="#F59E0B" opacity="0.3" />
  <path d="M310 180 Q 340 200 355 230 Q 330 250 310 220 Z" fill="#F59E0B" opacity="0.3" />

  <!-- Unity Hands Around the Circle -->
  <!-- Top hands -->
  <g fill="#8D5524" stroke="#522E10" stroke-width="3">
    <path d="M242 80 L242 120 Q242 135 256 135 Q270 135 270 120 L270 80 Z" />
    <!-- Wrists & Fingers clamping the ring -->
    <circle cx="256" cy="120" r="16" fill="#C68642" />
  </g>
  <g fill="#E0AC69" stroke="#78350F" stroke-width="3">
    <path d="M160 90 L185 130 Q195 140 205 130 L195 100 Z" />
    <circle cx="195" cy="130" r="14" fill="#F1C27D" />
  </g>
  <g fill="#3D2314" stroke="#1C0F08" stroke-width="3">
    <path d="M352 90 L327 130 Q317 140 307 130 L317 100 Z" />
    <circle cx="317" cy="130" r="14" fill="#5A331A" />
  </g>
  <!-- Left hands -->
  <g fill="#C68642" stroke="#78350F" stroke-width="3">
    <path d="M90 190 L135 205 Q145 215 135 225 L100 230 Z" />
    <circle cx="135" cy="215" r="15" fill="#E0AC69" />
  </g>
  <g fill="#4A2C18" stroke="#1C0F08" stroke-width="3">
    <path d="M95 270 L140 260 Q150 270 145 285 L105 310 Z" />
    <circle cx="140" cy="275" r="15" fill="#6A3F23" />
  </g>
  <!-- Right hands -->
  <g fill="#FFDBAC" stroke="#B45309" stroke-width="3">
    <path d="M422 190 L377 205 Q367 215 377 225 L412 230 Z" />
    <circle cx="377" cy="215" r="15" fill="#FFE5C4" />
  </g>
  <g fill="#8D5524" stroke="#451A03" stroke-width="3">
    <path d="M417 270 L372 260 Q362 270 367 285 L407 310 Z" />
    <circle cx="372" cy="275" r="15" fill="#A86B35" />
  </g>
  <!-- Bottom hands -->
  <g fill="#E0AC69" stroke="#78350F" stroke-width="3">
    <path d="M165 370 L195 330 Q205 320 215 330 L195 380 Z" />
    <circle cx="205" cy="330" r="14" fill="#F1C27D" />
  </g>
  <g fill="#3D2314" stroke="#1C0F08" stroke-width="3">
    <path d="M347 370 L317 330 Q307 320 297 330 L317 380 Z" />
    <circle cx="307" cy="330" r="14" fill="#5A331A" />
  </g>

  <!-- The Golden Blessing Coin Inside Basket -->
  <g filter="url(#dropShadow)">
    <circle cx="256" cy="225" r="62" fill="url(#coinGrad)" stroke="#FEF08A" stroke-width="5" />
    <circle cx="256" cy="225" r="50" fill="none" stroke="#78350F" stroke-width="2.5" stroke-dasharray="4,4" />
    <text x="256" y="246" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="64" font-weight="900" fill="#78350F" text-anchor="middle">$</text>
  </g>

  <!-- Traditional Hand-Woven Kusanya Basket with "KF" -->
  <g filter="url(#dropShadow)">
    <!-- Basket Rim -->
    <ellipse cx="256" cy="265" rx="102" ry="24" fill="#FEF3C7" stroke="#78350F" stroke-width="6" />
    <!-- Basket Body -->
    <path d="M156 265 Q170 380 256 385 Q342 380 356 265 Z" fill="url(#basketGrad)" stroke="#78350F" stroke-width="6" />
    
    <!-- Weaving Pattern Details -->
    <path d="M175 285 Q215 320 256 385" stroke="#78350F" stroke-width="4" fill="none" opacity="0.6" />
    <path d="M337 285 Q297 320 256 385" stroke="#78350F" stroke-width="4" fill="none" opacity="0.6" />
    <path d="M210 270 Q235 340 256 385" stroke="#78350F" stroke-width="4" fill="none" opacity="0.6" />
    <path d="M302 270 Q277 340 256 385" stroke="#78350F" stroke-width="4" fill="none" opacity="0.6" />
    <path d="M165 315 Q256 335 347 315" stroke="#FEF3C7" stroke-width="3" fill="none" opacity="0.7" />
    <path d="M185 350 Q256 365 327 350" stroke="#FEF3C7" stroke-width="3" fill="none" opacity="0.7" />

    <!-- Bold Woven "KF" Monogram on Basket Center -->
    <text x="222" y="342" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="78" font-weight="900" fill="#FEF3C7" stroke="#78350F" stroke-width="4" text-anchor="middle">K</text>
    <text x="286" y="342" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="78" font-weight="900" fill="#FEF3C7" stroke="#78350F" stroke-width="4" text-anchor="middle">F</text>
  </g>

  <!-- KUSANYA Brand Text -->
  <text x="256" y="456" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="64" font-weight="900" letter-spacing="4" fill="#FFFFFF" text-anchor="middle" filter="url(#dropShadow)">KUSANYA</text>
</svg>
